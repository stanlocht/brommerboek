name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/stanlocht/brommerboek-backend:${{ github.sha }}
            ghcr.io/stanlocht/brommerboek-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=https://brommerboek.nl
            NODE_ENV=production
          tags: |
            ghcr.io/stanlocht/brommerboek-frontend:${{ github.sha }}
            ghcr.io/stanlocht/brommerboek-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.BOX_IP }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            cd ~/brommerboek
            echo "TAG=${{ github.sha }}" > .env.deploy
            COMPOSE="docker compose -f docker-compose.yml --env-file .env --env-file .env.deploy"
            fail() {
              echo "deploy failed: $1" >&2
              $COMPOSE logs --tail=100 prestart backend || true
              exit 1
            }
            $COMPOSE pull
            $COMPOSE up -d || fail "docker compose up -d exited non-zero (dependency or start failure)"
            PRESTART_ID=$($COMPOSE ps -aq prestart)
            [ -n "$PRESTART_ID" ] || fail "prestart container not found"
            PRESTART_EXIT=$(docker inspect -f '{{.State.ExitCode}}' "$PRESTART_ID")
            [ "$PRESTART_EXIT" = "0" ] || fail "prestart (migrations) exited with code $PRESTART_EXIT"
            i=0
            until $COMPOSE exec -T backend curl -fsS http://localhost:8000/api/v1/utils/health-check/ >/dev/null 2>&1; do
              i=$((i + 1))
              [ "$i" -lt 12 ] || fail "backend not healthy after $i attempts"
              echo "waiting for backend health ($i/12)..."
              sleep 5
            done
            echo "backend healthy, pruning old images"
            docker image prune -f
