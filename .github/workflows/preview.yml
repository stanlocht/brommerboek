name: preview

# Per-PR staging previews at https://pr-<N>.brommerboek.nl.
#
# On every PR push: build images tagged pr-<N> (frontend with the preview URL
# baked into VITE_API_URL), then SSH to the box and bring up an isolated
# compose stack (own db, seeded by prestart) plus a Caddy site snippet.
# On PR close: tear the stack down, drop the snippet, remove the images.
#
# One-time box/DNS setup lives in docs/RUNBOOK.md ("PR previews").

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  packages: write
  pull-requests: write

# One deploy per PR at a time; a close event cancels an in-flight deploy
# before the teardown job runs.
concurrency:
  group: preview-pr-${{ github.event.number }}
  cancel-in-progress: true

env:
  PR_SLUG: pr-${{ github.event.number }}
  PREVIEW_HOST: pr-${{ github.event.number }}.brommerboek.nl

jobs:
  deploy:
    # Fork PRs get no secrets, so they can't (and shouldn't) deploy.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/stanlocht/brommerboek-backend:${{ env.PR_SLUG }}
          cache-from: |
            type=gha,scope=backend
            type=gha,scope=backend-preview
          cache-to: type=gha,scope=backend-preview,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=https://${{ env.PREVIEW_HOST }}
            NODE_ENV=production
          tags: ghcr.io/stanlocht/brommerboek-frontend:${{ env.PR_SLUG }}
          cache-from: |
            type=gha,scope=frontend
            type=gha,scope=frontend-preview
          cache-to: type=gha,scope=frontend-preview,mode=max

      # docker-compose.preview.yml is versioned here but has to exist on the
      # box; ship it through the SSH env as base64 (no scp step needed).
      - name: Encode preview compose file
        id: files
        run: echo "compose_b64=$(base64 -w0 docker-compose.preview.yml)" >> "$GITHUB_OUTPUT"

      - name: Deploy preview over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          COMPOSE_B64: ${{ steps.files.outputs.compose_b64 }}
        with:
          host: ${{ secrets.BOX_IP }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: PR_SLUG,PREVIEW_HOST,COMPOSE_B64
          script: |
            set -eu
            cd ~/brommerboek
            mkdir -p "previews/$PR_SLUG" caddy-previews
            docker network inspect previews >/dev/null 2>&1 || docker network create previews
            echo "$COMPOSE_B64" | base64 -d > docker-compose.preview.yml

            # Per-PR env: production values as base, preview overrides appended
            # (for duplicate keys the last occurrence wins).
            cp .env "previews/$PR_SLUG/.env"
            cat >> "previews/$PR_SLUG/.env" <<EOF

            # --- preview overrides (generated by preview.yml) ---
            TAG=$PR_SLUG
            PR_SLUG=$PR_SLUG
            DOMAIN=$PREVIEW_HOST
            ENVIRONMENT=staging
            FRONTEND_HOST=https://$PREVIEW_HOST
            BACKEND_CORS_ORIGINS=https://$PREVIEW_HOST
            SENTRY_DSN=
            SMTP_HOST=
            EOF

            # Cap concurrent previews so they can never crowd out production
            # on the 4 GB box: evict least-recently-deployed stacks until at
            # most MAX_PREVIEWS (including this one) remain. The .env mtime is
            # the freshness marker (rewritten just above on every deploy), and
            # eviction is safe — an evicted PR gets its preview back on its
            # next push. Runs before pull/up so the memory is free first.
            MAX_PREVIEWS=3
            evict() {
              echo "evicting preview $1 (cap: $MAX_PREVIEWS)"
              docker compose -p "$1" -f docker-compose.preview.yml \
                --env-file "previews/$1/.env" down -v --remove-orphans || true
              rm -f "caddy-previews/$1.caddy"
              rm -rf "previews/$1"
              docker rmi "ghcr.io/stanlocht/brommerboek-backend:$1" \
                "ghcr.io/stanlocht/brommerboek-frontend:$1" 2>/dev/null || true
            }
            while [ "$(ls -1 previews | wc -l)" -gt "$MAX_PREVIEWS" ]; do
              oldest=$(ls -1tr previews/*/.env 2>/dev/null | head -1 | xargs -r dirname | xargs -r basename)
              [ -n "$oldest" ] || break
              [ "$oldest" = "$PR_SLUG" ] && break
              evict "$oldest"
            done

            COMPOSE="docker compose -p $PR_SLUG -f docker-compose.preview.yml --env-file previews/$PR_SLUG/.env"
            fail() {
              echo "preview deploy failed: $1" >&2
              $COMPOSE logs --tail=100 prestart backend || true
              exit 1
            }
            $COMPOSE pull
            $COMPOSE up -d --force-recreate || fail "docker compose up -d exited non-zero (dependency or start failure)"
            PRESTART_ID=$($COMPOSE ps -aq prestart)
            [ -n "$PRESTART_ID" ] || fail "prestart container not found"
            PRESTART_EXIT=$(docker inspect -f '{{.State.ExitCode}}' "$PRESTART_ID")
            [ "$PRESTART_EXIT" = "0" ] || fail "prestart (migrations) exited with code $PRESTART_EXIT"
            i=0
            until $COMPOSE exec -T backend curl -fsS http://localhost:8000/api/v1/utils/health-check/ >/dev/null 2>&1; do
              i=$((i + 1))
              [ "$i" -lt 12 ] || fail "backend not healthy after $i attempts"
              echo "waiting for backend health ($i/12)..."
              sleep 5
            done

            # Only route traffic to a healthy stack: write the Caddy site
            # snippet last, then reload Caddy (a no-op if it already existed).
            cat > "caddy-previews/$PR_SLUG.caddy" <<EOF
            $PREVIEW_HOST {
                encode gzip
                handle /api/* {
                    reverse_proxy $PR_SLUG-backend:8000
                }
                handle /media/* {
                    reverse_proxy $PR_SLUG-backend:8000
                }
                handle /s/* {
                    reverse_proxy $PR_SLUG-backend:8000
                }
                handle {
                    reverse_proxy $PR_SLUG-frontend:80
                }
            }
            EOF
            docker compose -f docker-compose.yml --env-file .env --env-file .env.deploy \
              exec -T caddy caddy reload --config /etc/caddy/Caddyfile
            echo "preview live at https://$PREVIEW_HOST"

      - name: Comment preview URL on the PR
        if: github.event.action == 'opened' || github.event.action == 'reopened'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.number }}" --repo "${{ github.repository }}" --body \
            "🛵 Preview deployed: https://${PREVIEW_HOST} (fresh seeded database; redeployed on every push, torn down when this PR closes)"

      - name: Job summary
        run: echo "🛵 Preview live at <https://${PREVIEW_HOST}>" >> "$GITHUB_STEP_SUMMARY"

  teardown:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Tear down preview over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.BOX_IP }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: PR_SLUG
          script: |
            set -eu
            cd ~/brommerboek
            # Every step tolerates "never deployed" (e.g. the deploy failed).
            if [ -f docker-compose.preview.yml ] && [ -f "previews/$PR_SLUG/.env" ]; then
              docker compose -p "$PR_SLUG" -f docker-compose.preview.yml \
                --env-file "previews/$PR_SLUG/.env" down -v --remove-orphans || true
            fi
            rm -f "caddy-previews/$PR_SLUG.caddy"
            rm -rf "previews/$PR_SLUG"
            docker compose -f docker-compose.yml --env-file .env --env-file .env.deploy \
              exec -T caddy caddy reload --config /etc/caddy/Caddyfile || true
            docker rmi "ghcr.io/stanlocht/brommerboek-backend:$PR_SLUG" \
              "ghcr.io/stanlocht/brommerboek-frontend:$PR_SLUG" 2>/dev/null || true
            docker image prune -f
            echo "preview $PR_SLUG torn down"
