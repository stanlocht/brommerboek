# Per-PR preview stack (pr-<N>.brommerboek.nl) for the Hetzner box.
#
# This file is the source of truth; .github/workflows/preview.yml copies it to
# ~/brommerboek/docker-compose.preview.yml on every preview deploy and runs it
# with a per-PR project name + env file:
#
#   docker compose -p pr-123 -f docker-compose.preview.yml \
#     --env-file previews/pr-123/.env up -d
#
# Each PR gets its own frontend/backend/db (fresh, seeded by prestart) so
# migrations in the PR can't touch production data. Caddy reaches the stack
# over the shared external `previews` network via the ${PR_SLUG}-backend /
# ${PR_SLUG}-frontend aliases (explicit aliases because plain service names
# would collide between PR stacks on the shared network); the db stays on the
# stack's own default network. Named volumes are project-scoped (pr-123_pgdata)
# so teardown is `down -v`.
#
# Never add `build:` here — same 4 GB rule as docker-compose.yml. Memory is
# capped per service so a handful of previews can't starve production.

services:
  frontend:
    image: ghcr.io/stanlocht/brommerboek-frontend:${TAG:?}
    restart: unless-stopped
    mem_limit: 64m
    networks:
      default: {}
      previews:
        aliases:
          - ${PR_SLUG:?}-frontend

  prestart:
    image: ghcr.io/stanlocht/brommerboek-backend:${TAG:?}
    command: bash scripts/prestart.sh
    restart: "no"
    mem_limit: 512m
    env_file:
      - previews/${PR_SLUG:?}/.env
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: ghcr.io/stanlocht/brommerboek-backend:${TAG:?}
    restart: unless-stopped
    # The image CMD runs 4 uvicorn workers, sized for production; they OOM
    # against the preview mem_limit and a preview doesn't need them anyway.
    command: fastapi run --workers 1
    mem_limit: 512m
    env_file:
      - previews/${PR_SLUG:?}/.env
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
    volumes:
      - media:/app/media
    networks:
      default: {}
      previews:
        aliases:
          - ${PR_SLUG:?}-backend
    depends_on:
      db:
        condition: service_healthy
      prestart:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 384m
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  media:

networks:
  default: {}
  previews:
    external: true
