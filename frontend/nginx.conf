# index.html names the hashed asset files, so a cached copy points at chunks a
# deploy has already deleted — that is what keeps a stale client stale, and no
# Cache-Control at all lets a browser reuse it for hours on heuristic freshness
# alone. Revalidate every HTML response instead: one small conditional request,
# while the assets it references stay cacheable. Keyed on the response type
# because the shell is served both directly and as the deep-link fallback, and
# the try_files fallback below never re-enters location matching.
map $sent_http_content_type $bb_cache_control {
  default     "";
  ~^text/html "no-cache";
}

server {
  listen 80;

  add_header Cache-Control $bb_cache_control;

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri /index.html =404;
  }

  # Hashed build assets: a miss means the client holds a stale index.html
  # from before a deploy. Answering with the SPA fallback here would hand
  # text/html to a module import; a plain 404 lets the frontend's
  # vite:preloadError handler reload into the new release instead.
  location /assets/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
  }

  include /etc/nginx/extra-conf.d/*.conf;
}
