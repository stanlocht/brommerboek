<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Brommerboek — De Grote Tocht</title>
    <!-- Tint the browser chrome (status bar / address bar) in the site's
         paper tone instead of the browser default. The site looks the same
         in both OS colour schemes, but iOS Safari in dark mode only honours
         a theme-color that explicitly matches the dark media query. -->
    <meta
      name="theme-color"
      content="#e9dcbf"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#e9dcbf"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      /* Paper tone behind everything so the notch / overscroll areas and the
         first paint match the app instead of flashing white or black. */
      html {
        background-color: #e9dcbf;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Special+Elite&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
