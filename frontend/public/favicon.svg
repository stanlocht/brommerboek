<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Vintage road-atlas tile: paper card, dashed red route, map pin -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#e9dcbf" stroke="#9c6b3a" stroke-width="3"/>
  <rect x="7" y="7" width="50" height="50" rx="10" fill="none" stroke="#cbb187" stroke-width="1.5"/>
  <!-- departure dot -->
  <circle cx="15" cy="50" r="3" fill="none" stroke="#3a332a" stroke-width="2.5"/>
  <!-- dashed route -->
  <path d="M18 47 C 28 42, 22 34, 31 31 S 40 27, 42 24" fill="none" stroke="#c0362c" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="0.5 6.5"/>
  <!-- pin, hand-rotated like the map pins -->
  <g transform="rotate(7 43 37)">
    <path d="M43 9 c -6.9 0 -11 4.9 -11 10.6 0 7.6 11 17.4 11 17.4 s 11 -9.8 11 -17.4 C 54 13.9 47.9 9 43 9 Z" fill="#c0362c" stroke="#3a332a" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="43" cy="20" r="4.2" fill="#f4ecd6"/>
  </g>
</svg>
